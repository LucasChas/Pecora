<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pecora · Accesorios textiles para bebés</title>
    <meta
      name="description"
      content="Baberos, babitas, mantas y accesorios de algodón hechos a mano. Mirá el muestrario y hacé tu pedido."
    />
    <meta name="theme-color" content="#F8F1E1" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Instalable en la pantalla de inicio (sobre todo el panel, que se usa
         solo desde el celular): abre a pantalla completa, como una app. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook, X).
         __SITE_URL__ lo completa vite.config.ts con VITE_CATALOG_URL (o el
         dominio de producción si falta): estas URLs tienen que ser absolutas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pecora" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Pecora · Accesorios textiles para bebés" />
    <meta
      property="og:description"
      content="Baberos, babitas, mantas y accesorios de algodón hechos a mano. Mirá el muestrario y hacé tu pedido."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pecora · Accesorios textiles para bebés" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tipografías de marca: Fraunces (serif, títulos) + Inter (sans, funcional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
