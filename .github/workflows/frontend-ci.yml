name: Frontend CI

on:
  pull_request:
    paths:
      - "src/**"
      # Vitest también corre los tests de la lógica pura de las Edge Functions.
      - "supabase/functions/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # pnpm 11 (same major used locally; lockfileVersion 9.0). It needs Node >= 22.13.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (Vitest)
        run: pnpm test

      # No secrets needed: VITE_SUPABASE_* are only read at runtime in the
      # browser (src/lib/supabaseClient.ts throws there, not at build time).
      - name: Type-check and build
        run: pnpm build
